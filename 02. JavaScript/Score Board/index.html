<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board</title>
</head>
<body>
    <div class="border">
        <h1 id="score-board-title">Score Board</h1>
        <div class="score-board">
            <div id="team1-score">
                <h3>ATICK</h3>
                <p id="atick-points">0</p>
                <button id="team1-add" onclick="atick_points()">Add Point</button>
            </div>
            <div id="team2-score">
                <h3>GUMMY</h3>
                <p id="gummy-points">0</p>
                <button id="team2-add" onclick="gummy_points()">Add Point</button>
            </div>
        </div>
        <div id="reset">
            <button id="reset-button" onclick="reset()">Reset</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
